name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela el run anterior de la misma rama: no tiene sentido
# esperar resultados de un commit ya reemplazado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Versión exacta a propósito: setup-uv no publica tag mayor flotante más
      # allá de v7 aunque sus releases vayan en v9, así que `@v9` no resuelve.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked falla si uv.lock no corresponde a pyproject.toml. Ya pasó una
      # vez en este repo (lock desincronizado tras tocar pyproject), así que el
      # CI lo vigila.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

  migraciones:
    name: Migraciones (Postgres real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Los tests del job `backend` corren sobre SQLite y no prueban nada de
    # Alembic. Aquí sí hay Postgres, la misma versión que en producción.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Base de mantenimiento: cada test crea y borra la suya a partir de aquí.
      MIGRATIONS_TEST_DATABASE_URL: postgresql+psycopg://budget:budget@localhost:5432/postgres
      # Sin esto, si la variable de arriba faltara los tests se saltarían y el
      # job quedaría verde sin haber probado nada.
      MIGRATIONS_TEST_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependencias
        run: uv sync --locked

      # Cubre: esquema completo sobre base vacía, esquema == modelos
      # (`alembic check`), reversibilidad, que los datos sobrevivan a un
      # upgrade, y que el puente pre-Alembic stampee sin re-crear tablas.
      - name: Tests de migraciones
        run: uv run pytest tests/test_migrations.py -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` es `tsc -b && vite build`: el typecheck es el gate real
      # del frontend mientras no haya tests.
      - name: Typecheck y build
        run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    env:
      # Compose exige los secretos (\${VAR:?}); en el build de CI solo se
      # valida que los Dockerfiles compilan, no que arranquen, así que
      # dummy values son suficientes para la interpolación.
      JWT_SECRET: ci-dummy-not-a-real-secret-0000000000
      MINIO_ROOT_USER: ci-dummy
      MINIO_ROOT_PASSWORD: ci-dummy-password
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Valida que los Dockerfiles siguen construyendo (sin push). Cubre cosas
      # que los otros jobs no ven: el lock congelado del backend, el entrypoint
      # de migraciones y el build de nginx.
      - name: Construir backend y frontend
        run: docker compose build
