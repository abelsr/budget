# Issue #47: auditoría de dependencias. Dependabot abre PRs cuando una versión
# con CVE o un patch nuevo aparece. El backend usa uv (lockfile), el frontend
# npm; `github-actions` actualiza las acciones del workflow.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Las imágenes base (postgres:17-alpine, nginx) y la de MinIO
  # (chainguard/minio@sha256:…) viven en docker-compose.yml. Dependabot solo
  # soporta Dockerfiles/Kubernetes YAML: declarar `docker` sobre la raíz falla
  # con "No Dockerfiles nor Kubernetes YAML found in /", así que las imágenes
  # del compose se actualizan a mano (ver README, sección "MinIO image").
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
