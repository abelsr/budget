# Issue #47: auditoría de dependencias. Dependabot abre PRs cuando una versión
# con CVE o un patch nuevo aparece. El backend usa uv (lockfile), el frontend
# npm; `github-actions` actualiza las acciones del workflow.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Las imágenes base (postgres:17-alpine, chainguard/minio@sha256, nginx) viven
  # en docker-compose.yml, así que el ecosistema `docker` se declara sobre la
  # raíz del repo para que Dependabot siga también sus digests/tags. `/backend`
  # cubre además el Dockerfile del backend.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
