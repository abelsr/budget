<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-isotipo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eff6ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="budget" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica el tema guardado antes del primer paint (sin flash blanco)
      try {
        var t = localStorage.getItem("ff-theme")
        var dark =
          t === "dark" ||
          ((t === null || t === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) {
          document.documentElement.classList.add("dark")
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#070c16")
        }
      } catch (e) {}
    </script>
    <title>budget · finanzas del hogar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
