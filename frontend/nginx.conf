server {
    # nginx-unprivileged runs as an unprivileged user, so it cannot bind :80.
    listen 8080;

    # Tickets escaneados pesan varios MB (límite del backend: 10 MB)
    client_max_body_size 12m;

    # API → backend FastAPI (se expone bajo /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The worker must be revalidated on every navigation so updates reach installed apps.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    # SPA: fallback a index.html para rutas del cliente
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
