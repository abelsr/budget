server {
    # nginx-unprivileged runs as an unprivileged user, so it cannot bind :80.
    listen 8080;

    # Tickets escaneados pesan varios MB (límite del backend: 10 MB)
    client_max_body_size 12m;

    # ---------- Encabezados de seguridad (issue #34) ----------
    # CSP: la app no usa script inline ni eval ni fuentes externas (el tema
    # se aplica desde /theme-init.js, fuera del bundle). 'self' bloquea carga
    # remota de scripts; sin 'unsafe-inline' un XSS no puede inyectar JS.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS solo en HTTPS (en HTTP el header es ignorado y puede ser confuso).
    # En producción tras HTTPS: uncomment.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API → backend FastAPI (se expone bajo /api). Las cookies de sesión
    # httpOnly viajan por /api/* con credentials same-origin.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propagar Set-Cookie del backend (login/refresh/logout rotan el JWT).
        proxy_pass_header Set-Cookie;
    }

    # The worker must be revalidated on every navigation so updates reach installed apps.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    # SPA: fallback a index.html para rutas del cliente
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
