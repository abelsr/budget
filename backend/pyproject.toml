[project]
name = "backend"
version = "0.1.0"
description = "API de Finanzas Familiares"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "openai>=2.47.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.4.10",
    "sqlalchemy>=2.0.51",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
