[project]
name = "backend"
version = "0.1.0"
description = "API de Finanzas Familiares"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "openai>=2.47.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.4.10",
    "sqlalchemy>=2.0.51",
]

[tool.pytest.ini_options]
markers = ["db: tests que requieren una base de datos real (migraciones Postgres)"]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "freezegun>=1.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

# Issue #47: lint en CI. Reglas select: E (pico de PEP8), F (pyflakes:
# imports sin usar, variables reasignadas, etc.) y B (bugbear: bugs
# frecuentes tipo `==` en lugar de `is` con constantes). Se amplía si la
# deuda acumulada lo justifica.
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B"]
# Los docstrings largos de configuración y los strings de SQL en los tests
# exceden con frecuencia el límite; E501 se revisa a mano, no en CI.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# En `app/models/` los nombres "sin importar" son forward references de
# SQLAlchemy (`Mapped["Household"]`, `relationship(back_populates=...)`) que el
# ORM resuelve al registrar el mapeador, no al parsear. No son errores reales.
"app/models/*.py" = ["F821"]
# Los endpoints usan `Annotated[..., Depends(...)]` / `Body() = Model()` como
# default, que es el idiom de FastAPI; B008 (llamada en default) no aplica.
"app/api/routes/*.py" = ["B008"]
"app/main.py" = ["B008"]
