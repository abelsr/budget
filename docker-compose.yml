services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.example)}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://budget:budget@db:5432/budget
      # production activa el fail fast de app/config.py: sin un JWT_SECRET
      # fuerte (>= 32 bytes) y sin credenciales MinIO propias el contenedor
      # no arranca.
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -hex 32; see .env.example)}
      AUTH_REGISTER_LIMIT: ${AUTH_REGISTER_LIMIT:-5}
      AUTH_REGISTER_WINDOW_SECONDS: ${AUTH_REGISTER_WINDOW_SECONDS:-3600}
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-10}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-60}
      AUTH_JOIN_LIMIT: ${AUTH_JOIN_LIMIT:-10}
      AUTH_JOIN_WINDOW_SECONDS: ${AUTH_JOIN_WINDOW_SECONDS:-60}
      TICKET_SCAN_LIMIT: ${TICKET_SCAN_LIMIT:-10}
      TICKET_SCAN_WINDOW_SECONDS: ${TICKET_SCAN_WINDOW_SECONDS:-3600}
      MAX_MEMBERS_PER_HOUSEHOLD: ${MAX_MEMBERS_PER_HOUSEHOLD:-10}
      MAX_ACTIVE_INVITATIONS_PER_HOUSEHOLD: ${MAX_ACTIVE_INVITATIONS_PER_HOUSEHOLD:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.6-flash}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.example)}
      MINIO_BUCKET: attachments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

  uptime-kuma:
    profiles: [monitoring]
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"

  # Optional scheduler for scripts/backup.sh. Never starts on its own:
  #   docker compose --profile backup up -d backup
  #
  # It mounts the host Docker socket because the script drives `docker compose`
  # and `docker run` itself. That is a real privilege trade-off: any process in
  # this container can control Docker on the host. Host cron does the same job
  # without it and is the recommended option — see "Backups" in README.md.
  #
  # It also sleeps a fixed interval rather than running at a wall-clock time,
  # so the first backup happens on startup and the rest every 24 h from there.
  backup:
    profiles: [backup]
    image: docker:28-cli
    restart: unless-stopped
    working_dir: /project
    environment:
      # Required: the script derives the volume name from the project name, and
      # basename(/project) would give the wrong one.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-budget}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/project/scripts:ro
      - ./docker-compose.yml:/project/docker-compose.yml:ro
      - ./backups:/project/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache bash >/dev/null || exit 1
        while true; do
          /project/scripts/backup.sh || echo "backup failed; retrying after the interval"
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  pgdata:
  minio_data:
  uptime_kuma_data:
