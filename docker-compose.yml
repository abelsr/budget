services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.example)}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://budget:budget@db:5432/budget
      # production activa el fail fast de app/config.py: sin un JWT_SECRET
      # fuerte (>= 32 bytes) y sin credenciales MinIO propias el contenedor
      # no arranca.
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -hex 32; see .env.example)}
      AUTH_REGISTER_LIMIT: ${AUTH_REGISTER_LIMIT:-5}
      AUTH_REGISTER_WINDOW_SECONDS: ${AUTH_REGISTER_WINDOW_SECONDS:-3600}
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-10}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-60}
      AUTH_JOIN_LIMIT: ${AUTH_JOIN_LIMIT:-10}
      AUTH_JOIN_WINDOW_SECONDS: ${AUTH_JOIN_WINDOW_SECONDS:-60}
      TICKET_SCAN_LIMIT: ${TICKET_SCAN_LIMIT:-10}
      TICKET_SCAN_WINDOW_SECONDS: ${TICKET_SCAN_WINDOW_SECONDS:-3600}
      MAX_MEMBERS_PER_HOUSEHOLD: ${MAX_MEMBERS_PER_HOUSEHOLD:-10}
      MAX_ACTIVE_INVITATIONS_PER_HOUSEHOLD: ${MAX_ACTIVE_INVITATIONS_PER_HOUSEHOLD:-5}
      # Cookie de sesión httpOnly (issue #34). En deploy con HTTPS activa
      # SESSION_COOKIE_SECURE=true para que el navegador solo la envíe por TLS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.6-flash}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.example)}
      MINIO_BUCKET: attachments
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # python:3.14-slim has no curl, so the check uses the stdlib urllib.
    # 127.0.0.1 (not localhost): uvicorn binds 0.0.0.0 (IPv4 only). /health also
    # runs `SELECT 1`, so "healthy" means the DB is reachable too.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      # Bound to localhost: the frontend reaches the backend through the
      # compose network (nginx.conf proxies /api to backend:8000), not the
      # published host port.
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only, and BusyBox wget
      # resolves localhost to ::1 first, which would make a healthy container
      # report unhealthy. Port 8080: nginx-unprivileged cannot bind :80.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8081:8080"

  uptime-kuma:
    profiles: [monitoring]
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
  minio_data:
  uptime_kuma_data:
